<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Jury Page</title>
</head>
<body>

<h1>Jury Page</h1>

<div>
    <label for="ratingDropdown">Select Rating: </label>
    <select id="ratingDropdown" th:value="${selectedRating}">
        <option th:each="i : ${#numbers.sequence(1, 10)}" th:value="${i}" th:text="${i}"></option>
    </select>
    <button onclick="addRating()">Add Rating</button>
</div>

<div>
    <h3>Average Rating:</h3>
    <p th:text="'Average Rating: ' + ${averageRating.toFixed(2)}"></p>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script>
    function addRating() {
        var selectedRating = $("#ratingDropdown").val();

        $.ajax({
            type: "POST",
            url: "/ratings/JuryMember1", // Replace with the actual username or ID of the jury member
            data: {rating: selectedRating},
            success: function (response) {
                alert(response);
                updateAverageRating();
            },
            error: function (error) {
                alert("Error: " + error.responseText);
            }
        });
    }

    function updateAverageRating() {
        $.ajax({
            type: "GET",
            url: "/ratings/average",
            success: function (averageRating) {
                $("p").text("Average Rating: " + averageRating.toFixed(2));
            },
            error: function (error) {
                alert("Error: " + error.responseText);
            }
        });
    }

    // Initial load of average rating
    updateAverageRating();
</script>

</body>
</html>
